server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  websocket: ws://你的电脑局域网IP:8000/xiaoyue/v1/
  vision_explain: http://你的电脑局域网IP:8003/mcp/vision/explain
  timezone_offset: +8
  auth:
    enabled: false

selected_module:
  VAD: SileroVAD
  ASR: SherpaASR
  LLM: DeepSeekLLM
  VLLM: ChatGLMVLLM
  TTS: EdgeTTS
  Memory: nomem
  Intent: function_call

VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 300

ASR:
  SherpaASR:
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    model_type: sense_voice

LLM:
  DeepSeekLLM:
    type: openai
    model_name: deepseek-chat
    url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    temperature: 0.7
    max_tokens: 500
    top_p: 1
    frequency_penalty: 0

TTS:
  EdgeTTS:
    type: edge
    voice: zh-CN-XiaoxiaoNeural
    output_dir: tmp/

Intent:
  function_call:
    type: function_call
    functions:
      - play_music
      - change_role

plugins:
  play_music:
    description: "当用户想听儿歌、让小月唱歌、点歌或换一首儿歌时调用。可点儿歌：小星星、两只老虎、拍拍手、数一数、洗手歌、晚安小月亮。"
    music_dir: "./music/儿歌"
    music_ext:
      - ".wav"
      - ".mp3"
    refresh_time: 30

parent_console:
  enabled: true
  token_env: PARENT_CONSOLE_TOKEN

prompt: |
  你是小月，一个陪小朋友学习和玩耍的早教小伙伴，声音温柔清脆，像幼儿园里最耐心的大姐姐。你的名字叫小月。你面对的是小朋友，说话要用最简单的短句，一次只说一到两句话，多用叠词和拟声词。你擅长讲儿歌、讲小故事、认识颜色形状数字、学简单的汉字拼音和英语单词、讲生活小常识。小朋友答对了要热情夸奖，答错了不批评，用"没关系，我们再试一次"鼓励他。每次互动尽量带一个小问题，引导孩子开口说话。遇到你不知道的事，就诚实地说"这个我要去问问月亮婆婆"。如果孩子提到危险、受伤、害怕或家里的大事，温柔地提醒他去找爸爸妈妈或身边的大人。不要吓唬孩子，不要讲恐怖、暴力、成人的内容，不要询问家庭住址、电话等隐私。

rag:
  enabled: true
  top_k: 4

# ============================================================
# 内容安全屏蔽词库
# action:
#   block   = 直接拦截，回复 safe_reply
#   replace = 把命中词替换成 ***，再继续
#   audit   = 只写日志，不拦截（适合童话/剧情类分级）
# allow_words: 先移除这些词再匹配，避免误伤童话内容
# ============================================================
enabled: true
safe_reply: "这个话题我还不适合聊，我们换个话题吧。"

categories:
  porn:
    action: block
    words: ["色情", "裸聊", "成人视频", "约炮"]

  insult:
    action: block
    words: ["傻逼", "操你", "妈的", "滚蛋", "去死", "狗东西"]

  violence:
    action: audit
    allow_words: ["大灰狼", "小红帽", "狼外婆", "猎人", "打猎"]
    words: ["杀人", "砍死", "血腥", "虐待", "炸弹", "枪支", "爆头"]

  horror:
    action: audit
    allow_words: ["大灰狼", "小红帽", "狼外婆", "幽灵", "万圣节"]
    words: ["鬼", "僵尸", "吃人", "凶杀", "尸体", "恐怖片"]

  self_harm:
    action: block
    words: ["自杀", "跳楼", "割腕", "喝农药", "自残", "玩火", "玩插座"]

  drugs_gambling:
    action: block
    words: ["毒品", "吸毒", "赌博", "赌场", "下注", "大麻", "冰毒", "摇头丸"]

  political:
    action: block
    
    words: []
    patterns: []

  superstition:
    action: audit
    words: ["算命", "邪教", "驱鬼", "招魂", "法事"]

  privacy:
    action: block
    patterns:
      - "1[3-9][0-9]{9}"
      - "[0-9]{17}[0-9Xx]"
      - "[0-9]{16,19}"
      - "(我家|住址|地址|门牌号|小区).{0,12}(路|街|号|栋|单元|室)"
      - "(告诉我|说说).{0,6}(你家|住在哪|家庭住址)"

  ads:
    action: block
    patterns:
      - "(加|联系).{0,4}(微信|vx|v信|weixin|qq)"
      - "(扫码|扫描二维码|二维码)"
      - "(购买链接|下单链接|淘宝|拼多多|红包|私聊)"

  discrimination:
    action: block
    # 歧视攻击：种族、地域、外貌、残疾等。建议持续补充专业词库。
    words: ["乡巴佬", "土包子", "残废", "智障", "傻子", "丑八怪", "死胖子", "娘娘腔", "洋鬼子", "黑鬼", "地域黑"]